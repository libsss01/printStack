<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Caisse Web - Démo Impression</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            color: #111827;
            font-size: 24px;
            text-align: center;
        }

        .section {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f9fafb;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🛒 Caisse En Ligne (Démo)</h1>
        <p style="text-align: center; color: #6b7280; font-size: 14px;">Connectez-vous au Hardware Bridge local pour
            imprimer sur votre 58mm.</p>

        <!-- Impression de Texte -->
        <div class="section">
            <label>Imprimer un Ticket (Texte)</label>
            <textarea id="text-input" rows="4" placeholder="Tapez votre ticket de caisse ici..."></textarea>
            <button onclick="printText()">Imprimer le Texte</button>
        </div>

        <!-- Impression d'Image -->
        <div class="section">
            <label>Imprimer un Logo / Image</label>
            <input type="file" id="image-input" accept="image/png, image/jpeg">
            <button onclick="printImage()" style="background: #059669;">Imprimer l'Image</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const PRINT_IMAGE_URL = 'http://localhost:20726/print/image';
        const PRINT_TEXT_URL = 'http://localhost:20726/print/text';
        const statusDiv = document.getElementById('status');

        function showStatus(msg, isError = false) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = msg;
            statusDiv.className = isError ? 'error' : 'success';
            setTimeout(() => statusDiv.style.display = 'none', 5000);
        }

        async function sendPrintJob(url, payload) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.success) {
                    showStatus('✅ Impression lancée avec succès !');
                } else {
                    showStatus('❌ Erreur du pont: ' + data.error, true);
                }
            } catch (err) {
                showStatus('❌ Impossible de contacter le Hardware Bridge', true);
            }
        }

        // Fonction pour envoyer du texte brut
        function printText() {
            const text = document.getElementById('text-input').value;
            if (!text) return alert("Veuillez entrer du texte.");
            sendPrintJob(PRINT_TEXT_URL, {content: text });
        }

        // Fonction pour envoyer une image en Base64
        function printImage() {
            const fileInput = document.getElementById('image-input');
            if (fileInput.files.length === 0) return alert("Veuillez sélectionner une image.");

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                sendPrintJob(PRINT_IMAGE_URL, {content: e.target.result });
            };
            reader.readAsDataURL(file);
        }

    </script>

</body>

</html>
